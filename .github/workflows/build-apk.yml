name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install "flet[all]==0.28.3"
      - run: flet build apk -v
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: build/apk/*.apk
